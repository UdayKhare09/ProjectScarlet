server {
    server_name obs.uday.bfhl.teamzemo.tech;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Grafana live streaming (WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Grafana can serve large responses
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/obs.uday.bfhl.teamzemo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obs.uday.bfhl.teamzemo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = obs.uday.bfhl.teamzemo.tech) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name obs.uday.bfhl.teamzemo.tech;
    return 404;
}
