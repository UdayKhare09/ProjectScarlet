[server]
domain = obs.uday.bfhl.teamzemo.tech
root_url = https://obs.uday.bfhl.teamzemo.tech
serve_from_sub_path = false

[security]
admin_user = admin
cookie_secure = true
cookie_samesite = lax

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[feature_toggles]
enable = traceToMetrics traceQLStreaming metricsSummary correlations newVizTooltips

[unified_alerting]
enabled = true

[alerting]
enabled = false
